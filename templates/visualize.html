<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualize Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .sheet {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
        }
        table.data {
            width: 100%;
            border-collapse: collapse;
        }
        table.data th, table.data td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        table.data th {
            background-color: #007bff;
            color: white;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            color: white;
            background-color: #007bff; 
            border: none;
            border-radius: 5px;
            text-decoration: none; 
            text-align: center;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #0056b3; 
        }
    </style>
</head>
<body>
    <h1>Data Visualization</h1>
    {% for sheet_name, table in sheets.items() %}
        <div class="sheet">
            <h2>{{ sheet_name }}</h2>
            {{ table|safe }}
        </div>
    {% endfor %}
    <a href="{{ url_for('download_file') }}" class="button">Download converted_macros.py</a>
    <a href="{{ url_for('result') }}" class="button">Back to Results</a>
    <a href="{{ url_for('index') }}" class="button">Upload Another File</a>
</body>
</html>
