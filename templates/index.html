<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Macro Executor</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="file"], input[type="text"] {
            margin: 10px 0;
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 0;
        }
        button:hover {
            background-color: #218838;
        }
        h2 {
            margin-top: 20px;
        }
        pre {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            overflow: auto;
        }
        .macro-item {
            padding: 10px;
            margin: 5px 0;
            background-color: #e9ecef;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .macro-item:hover {
            background-color: #d6d6d6;
        }
        .tab {
            display: inline-block;
            padding: 10px;
            cursor: pointer;
            background-color: #e9ecef;
            margin-right: 5px;
            border-radius: 5px;
        }
        .tab.active {
            background-color: #28a745;
            color: white;
        }
        .tab-content {
            display: none;
            margin-top: 20px;
        }
        .tab-content.active {
            display: block;
        }
        /* Table styles */
        table {
            border-collapse: collapse; /* Ensures that borders are collapsed into a single border */
            width: 100%; /* Makes the table take the full width of its container */
        }
        th, td {
            border: 2px solid #28a745; /* Change the border color and width */
            padding: 10px; /* Adds padding inside the cells */
            text-align: left; /* Aligns text to the left */
        }
        th {
            background-color: #f2f2f2; /* Light gray background for header cells */
        }
    </style>
</head>
<body>
    <header>
        <h1>Excel Macro Executor</h1>
    </header>
    <div class="container">
        <input type="file" id="fileInput" accept=".xlsm" />
        <button id="uploadBtn">Upload</button>
        <button id="viewDataBtn">View Data</button>
        <button id="existingMacrosBtn">Existing Macros</button>
        
        <h2>Response</h2>
        <div id="responseOutput"></div>
    </div>

    <script>
        let uploadedFileName = '';
        let currentSheetData = {}; // Store current sheet data for editing

        function handleResponse(response) {
            console.log("Response Data:", response); // Log the entire response for debugging
            $('#responseOutput').empty(); // Clear previous output
            if (response.sheets && response.data) {
                currentSheetData = response.data; // Store the data for editing
                createTabs(response.sheets, response.data);
            } else {
                $('#responseOutput'). text(JSON.stringify(response, null, 2));
            }
        }

        function createTabs(sheets, data) {
            const tabContainer = $('<div></div>');
            sheets.forEach(sheet => {
                const tab = $(`<div class="tab">${sheet}</div>`);
                tab.on('click', function() {
                    $('.tab').removeClass('active');
                    $(this).addClass('active');
                    showSheetData(sheet, data[sheet]);
                });
                tabContainer.append(tab);
            });
            $('#responseOutput').append(tabContainer);
            if (sheets.length > 0) {
                tabContainer.children().first().addClass('active');
                showSheetData(sheets[0], data[sheets[0]]);
            }
        }

        function showSheetData(sheetName, rows) {
            const contentDiv = $('<div class="tab-content"></div>');
            if (rows.length > 0) {
                const table = $('<table></table>');
                const headerRow = $('<tr></tr>');
                Object.keys(rows[0]).forEach(key => {
                    headerRow.append(`<th>${key}</th>`);
                });
                headerRow.append('<th>Actions</th>');
                table.append(headerRow);
                rows.forEach((row, index) => {
                    const dataRow = $('<tr></tr>');
                    Object.values(row).forEach(value => {
                        dataRow.append(`<td contenteditable="true">${value}</td>`);
                    });
                    dataRow.append(`<td><button onclick="deleteRow(${index})">Delete</button></td>`);
                    table.append(dataRow);
                });
                contentDiv.append(table);
                contentDiv.append(createAddRowForm());
            } else {
                contentDiv.append('<p>No Data</p>');
            }
            $('.tab-content').remove();
            $('#responseOutput').append(contentDiv);
            contentDiv.addClass('active');
        }

        function createAddRowForm() {
            const form = $('<div></div>');
            const inputFields = Object.keys(currentSheetData[Object.keys(currentSheetData)[0]][0]).map(key => {
                return `<input type="text" placeholder="Enter ${key}" class="new-row-input" />`;
            }).join('');
            form.append(inputFields);
            form.append('<button onclick="addRow()">Add Row</button>');
            return form;
        }

        function addRow() {
            const newRow = {};
            $('.new-row-input').each(function(index) {
                const key = Object.keys(currentSheetData[Object.keys(currentSheetData)[0]][0])[index];
                newRow[key] = $(this).val();
            });
            console.log("New Row Data:", newRow);
            $.post('/add_row', { filename: uploadedFileName, newRow: JSON.stringify(newRow) }, function(response) {
                viewData();
            }).fail(function(jqXHR) {
                console.error("Error adding row:", jqXHR.responseText);
            });
        }

        function deleteRow(index) {
            console.log("Delete Row Index:", index);
            $.post('/delete_row', { filename: uploadedFileName, rowIndex: index }, function(response) {
                viewData();
            });
        }

        function handleError(error) {
            $('#responseOutput').text(JSON.stringify(error.responseJSON || {"error": "Unknown error"}, null, 2));
        }

        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return alert("Please select a file");
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            $.ajax({
                url: '/upload',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    handleResponse(response);
                    uploadedFileName = fileInput.files[0].name;
                },
                error: handleError
            });
        }

        function viewData() {
            if (!uploadedFileName) return alert("Please upload a file first");
    
            const formData = new FormData();
            formData.append('filename', uploadedFileName); 
            
            $.ajax({
                url: '/view_data',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: handleResponse,
                error: handleError
            });
        }
        
        function existingMacros() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return alert("Please select a file");
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            $.ajax({
                url: '/existing_macros',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    console.log ("Existing Macros:", response); // Log the response for debugging
                    let output = '<h3>Select a Macro to Execute:</h3>';
                    if (response.macros && response.macros.length > 0) {
                        response.macros.forEach(macro => {
                            output += `<div class="macro-item" onclick="executeMacro('${macro}')">${macro}</div>`;
                        });
                    } else {
                        output += '<p>No existing macros found.</p>';
                    }
                    $('#responseOutput').html(output);
                },
                error: handleError
            });
        }
        
        function executeMacro(macroName) {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return alert("Please select a file");
            if (!macroName) return alert("No macro selected");
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('macro_name', macroName);
            
            $.ajax({
                url: '/execute_macro',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: handleResponse,
                error: handleError
            });
        }
        
        document.getElementById('uploadBtn').onclick = uploadFile;
        document.getElementById('viewDataBtn').onclick = viewData;
        document.getElementById('existingMacrosBtn').onclick = existingMacros;

    </script>
</body>
</html>
